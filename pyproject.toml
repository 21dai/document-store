[project]
name = "document-store"
version = "0.1.0"
description = "Microservicio responsable de persistir y administrar documentos procesados en MongoDB."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.1",
    "pydantic-settings>=2.16.0",
    "pymongo>=4.19.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
